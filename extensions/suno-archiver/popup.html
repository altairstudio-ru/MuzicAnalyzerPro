<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suno Archiver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0b10;
            color: #ece7e1;
            width: 340px;
            padding: 16px;
            font-size: 14px;
        }
        h1 {
            font-size: 16px;
            color: #ffb454;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status {
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status.connected {
            background: rgba(110,231,160,.12);
            border: 1px solid rgba(110,231,160,.3);
            color: #6ee7a0;
        }
        .status.disconnected {
            background: rgba(240,97,95,.12);
            border: 1px solid rgba(240,97,95,.3);
            color: #f0615f;
        }
        .status.unknown {
            background: rgba(255,255,255,.1);
            border: 1px solid #26262e;
            color: #8f8a83;
        }
        .token-info {
            background: #12121a;
            border: 1px solid #26262e;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
            word-break: break-all;
            font-size: 12px;
            color: #8f8a83;
        }
        .token-info .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #8f8a83;
            margin-bottom: 4px;
        }
        .token-info .value {
            color: #ece7e1;
            font-family: monospace;
            font-size: 11px;
        }

        button {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #26262e;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background: #1a1a24;
            color: #ece7e1;
            margin-bottom: 12px;
            transition: background 0.15s;
        }
        button:hover { background: #26262e; }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        button.primary {
            background: #ffb454;
            border-color: #ffb454;
            color: #201707;
            font-weight: 600;
        }
        button.primary:hover { background: #e5a03f; }
        button.primary:disabled { background: #ffb45455; }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            cursor: pointer;
        }
        .checkbox-row input[type=checkbox] {
            width: 16px;
            height: 16px;
            accent-color: #ffb454;
            cursor: pointer;
        }
        .checkbox-row label {
            cursor: pointer;
            color: #ece7e1;
            font-size: 13px;
        }
        .hint {
            color: #8f8a83;
            font-size: 11px;
            margin-top: 4px;
            padding-left: 24px;
        }
        .guidance {
            background: #12121a;
            border: 1px solid #26262e;
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
        }
        .guidance-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .guidance-cmd {
            font-family: monospace;
            font-size: 12px;
            background: #0b0b10;
            padding: 4px 8px;
            border-radius: 4px;
            margin: 3px 0;
            color: #ffb454;
        }
        .guidance-hint {
            color: #8f8a83;
            font-size: 11px;
            margin-top: 6px;
        }
        .footer {
            border-top: 1px solid #26262e;
            padding-top: 10px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #8f8a83;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .dot.green { background: #6ee7a0; }
        .dot.red { background: #f0615f; }
        .dot.gray { background: #8f8a83; }
        .dot.yellow { background: #e5b567; }
    </style>
</head>
<body>
    <h1>🎵 Suno Archiver</h1>

    <div id="status-bar" class="status unknown">
        <span id="status-dot" class="dot gray"></span>
        <span id="status-text">Проверка...</span>
    </div>

    <div id="token-section" class="token-info" style="display:none;">
        <div class="label">Токен найден</div>
        <div class="value" id="token-display"></div>
    </div>

    <button id="send-btn" class="primary" disabled>
        📤 Отправить токен
    </button>

    <div class="checkbox-row" id="auto-toggle">
        <input type="checkbox" id="auto-send">
        <label for="auto-send">Автоматически отправлять токен при входе на suno.com</label>
    </div>
    <div class="hint">Если включено — токен передаётся фоново без лишних нажатий</div>

    <div class="footer">
        <span id="app-status">Приложение: ✗</span>
        <span id="token-source">Источник: —</span>
    </div>

    <div id="debug-section" style="display:none; margin-top:8px;">
        <div class="footer" style="border-top-color:#26262e; cursor:pointer;" id="debug-toggle">
            <span>🔧 Дебаг</span>
            <span id="debug-arrow">▶</span>
        </div>
        <div id="debug-content" style="display:none; background:#12121a; border:1px solid #26262e; border-radius:6px; padding:8px; margin-top:6px; font-size:11px; font-family:monospace; color:#8f8a83; max-height:200px; overflow-y:auto; white-space:pre-wrap;"></div>
    </div>

    <div id="guidance" class="guidance" style="display:none;">
        <div class="guidance-title">🚀 Чтобы запустить:</div>
        <div class="guidance-cmd">cd ~/MuzicAnalyzerPro</div>
        <div class="guidance-cmd">./bin/suno-archiver serve</div>
        <div class="guidance-hint">или просто <strong>suno-archiver serve</strong> если добавили в PATH</div>
        <div style="margin-top:8px; border-top:1px solid #26262e; padding-top:8px;">
            <a href="#" id="launch-link" style="color:#ffb454; font-size:13px;">Запустить из расширения (если нужны права)</a>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
