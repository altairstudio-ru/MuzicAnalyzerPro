[project]
name = "muzic-analyzer"
version = "0.1.0"
description = "Audio analysis engine for MuzicAnalyzerPro"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyloudnorm>=0.1",
    "faster-whisper>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
